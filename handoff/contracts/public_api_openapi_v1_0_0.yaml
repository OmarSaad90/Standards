openapi: 3.1.0
info:
  title: Aedifica Free Standards Explorer Public API
  version: 1.0.0
  description: >
    Public-only API. This API MUST NOT return commercial relationship IDs, endpoint pairs,
    per-edge rationale, per-edge provenance, audit states, Expanded/Disputed/Quarantine
    states, customer overlays, or any other protected Pro relationship payload.
servers:
  - url: https://{host}
    variables:
      host:
        default: example.com
paths:
  /api/public/meta:
    get:
      summary: Public Explorer metadata and filter values
      responses:
        "200":
          description: Public metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeta"
  /api/public/standards:
    get:
      summary: Search/browse public standards
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: subject
          schema: { type: string }
        - in: query
          name: grade
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [current, historical, all], default: current }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 18 }
      responses:
        "200":
          description: Paginated public standards
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PublicStandard" }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        "400":
          description: Invalid query parameter
  /api/public/standards/{code}:
    get:
      summary: Get one public standard by code
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public standard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStandard" }
        "404":
          description: Standard not found
components:
  schemas:
    RelationshipCounts:
      type: object
      additionalProperties: false
      required: [supports, reinforces, next, total]
      properties:
        supports: { type: integer, minimum: 0 }
        reinforces: { type: integer, minimum: 0 }
        next: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    PublicStandard:
      type: object
      additionalProperties: false
      required:
        - uid
        - code
        - area
        - area_name
        - label
        - grades
        - current
        - status
        - domain
        - frameworks
        - versions
        - source_url
        - source_url_kind
        - aedifica_view
        - generic_evidence_signals
        - relationship_signals
        - framework_lineage
      properties:
        uid: { type: string }
        code: { type: string }
        area: { type: string }
        area_name: { type: string }
        label: { type: string }
        grades:
          type: array
          items: { type: string }
        current: { type: boolean }
        status: { type: string }
        domain: { type: [string, "null"] }
        frameworks:
          type: array
          items: { type: string }
        versions: { type: array }
        source_url: { type: [string, "null"] }
        source_url_kind: { type: [string, "null"] }
        aedifica_view: { type: string }
        generic_evidence_signals:
          type: array
          items: { type: string }
        relationship_signals:
          $ref: "#/components/schemas/RelationshipCounts"
        framework_lineage: {}
    PublicMeta:
      type: object
      additionalProperties: false
      required: [version, total_count, current_count, areas, public_contract]
      properties:
        version: { type: string }
        total_count: { type: integer }
        current_count: { type: integer }
        areas: { type: array }
        public_contract: { type: string }
